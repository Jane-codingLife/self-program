<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane & Sami | 後臺登入</title>
    <link rel="stylesheet" href="../../css/general/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style>

    </style>
</head>

<body>

    <div class="login_container container">
        <div class="row justify-content-center">
            <div class="col-10 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <a href="index.html" class="login-brand-logo">Jane & Sami</a>
                        <span class="login-brand-subtitle">✦ 系統管理中心 ✦</span>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label" for="aid">管理員帳號</label>
                            <div class="login-input-group">
                                <i class="bi bi-person-bounding-box"></i>
                                <input type="text" id="aid" class="login-form-control" placeholder="請輸入帳號..." required
                                    autocomplete="username" data-field="admin_uid">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="passwd">管理員密碼</label>
                            <div class="login-input-group">
                                <i class="bi bi-shield-lock"></i>
                                <input type="password" id="passwd" class="login-form-control" placeholder="請輸入密碼..."
                                    required autocomplete="current-password" data-field="admin_psw">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-login-submit">安全登入 ✦</button>
                    </div>
                    <div class="card-footer">
                        <a href="index.html" class="back-to-home-link"><i class="bi bi-arrow-left-short"></i> 取消並返回 Jane
                            & Sami
                            首頁</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../js/general/bootstrap.bundle.min.js"></script>
</body>

</html>
