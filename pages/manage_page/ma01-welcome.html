<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane & Sami | 後臺管理首頁</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/general/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        [v-cloak] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="app" class="container" v-cloak>
        <div class="row" v-if="isVerified">
            <h1>Welcom！</h1>
        </div>
    </div>
    <script src="../../js/general/bootstrap.bundle.min.js"></script>
    <script src="../../js/general/vue.global.js"></script>
    <script src="../../js/custom/axios_session.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        Vue.createApp({
            data() {
                return {
                    isVerified: false,
                }
            },
            mounted() {
                this.checkLoginStatus();
            },
            methods: {
                // 替代 Session 檢查
                checkLoginStatus() {
                    const vm = this;
                    axios.get('http://localhost/self-program/api/api_00_login_status.php')
                        .then(function (response) {
                            if (response.data.admin_logged_in) {
                                // 驗證通過保留畫面
                                vm.isVerified = true;
                                console.log(response.data.message);
                            } else {
                                // 未驗證過保留 login 畫面
                                Swal.fire({
                                    title: "未經授權或登入已逾時！",
                                    text: "系統將於 3 秒後自動返回登入頁面。",
                                    icon: "warning",
                                    timer: 3000,
                                    timerProgressBar: true,
                                    showConfirmButton: false,
                                    allowOutsideClick: false
                                }).then(() => {
                                    window.location.href = './login.html';
                                });
                            }
                        })
                        .catch(function (error) {
                            Swal.fire({
                                title: "系統發生錯誤！請將下列資訊貼給系統管理員。",
                                text: error,
                                icon: "error",
                                allowOutsideClick: false,
                                showConfirmButton: false
                            });
                        });
                },
            }
        }).mount('#app');
    </script>
</body>

</html>
